name: Tally
options:
  bundleIdPrefix: app.tally
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  Tally:
    type: application
    platform: iOS
    sources:
      - path: ios/Tally
      - path: cpp/core
        excludes:
          - tests
          - CMakeLists.txt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tally.ios
        INFOPLIST_FILE: ios/Tally/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: ios/Tally/Bridge/Tally-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: ios/Tally/Tally.entitlements
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        GENERATE_INFOPLIST_FILE: false
        TALLY_API_BASE_URL: ""
    scheme:
      testTargets:
        - TallyTests
  TallyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ios/TallyTests
    dependencies:
      - target: Tally
