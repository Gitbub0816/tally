name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S cpp -B cpp/build
      - run: cmake --build cpp/build
      - run: ctest --test-dir cpp/build --output-on-failure

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: cp .dev.vars.example .dev.vars
      - run: npm test
      - run: npm run typecheck
      - run: npm run deploy:dry

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild build -project Tally.xcodeproj -scheme Tally -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
      - name: Validate installable app bundle
        run: |
          APP_PATH="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug-iphonesimulator/Tally.app' -type d -print -quit)"
          test -n "$APP_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")" = "Tally"
          test -x "$APP_PATH/Tally"
          for model in boeing_757_200 boeing_787_9; do
            test -f "$APP_PATH/$model.usdz"
            unzip -tq "$APP_PATH/$model.usdz"
          done
